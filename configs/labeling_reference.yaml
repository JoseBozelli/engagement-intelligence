# Reference labeling configuration: target definition and evaluation splits.
# All values are illustrative defaults in business units (D-025); deployments define their own.
target:
  name: lapse_60d
  engagement_events:            # account-initiated activity that counts as engagement
    - {event_type: session.booked, actor: account}
    - {event_type: session.completed, actor: account}
    - {event_type: message.replied, actor: account}
    - {event_type: followup.completed, actor: account}
    - {event_type: task.completed, actor: account}
  horizon_days: 60              # lapse = no engagement in the next 60 days
  eligibility_window_days: 90   # assess accounts engaged in the previous 90 days (as known at assessment time)
  label_settlement_days: 14     # wait for late-recorded events before a label is final
  assessment_weekday: monday
splits:
  windows:                      # assessment-date windows [start, end)
    - {name: train, start: 2024-07-01, end: 2025-07-01}
    - {name: validation, start: 2025-07-01, end: 2025-12-01}
    - {name: test, start: 2025-12-01, end: 2026-05-01}
  cold_start_after: train       # accounts first observed after this window ends form the cold-start slice