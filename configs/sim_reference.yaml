# Reference simulator configuration.
# All values are illustrative defaults chosen to produce heterogeneous, noisy trajectories for methodology evaluation.
# They are not estimates of any real population.

# Latent traits are on a sandardized scale: 0 = population-typical,
# +/- 1 = one standard deviation above/below.

seed: 20240101

calendar:
  start: 2024-01-01
  end: 2026-07-01           # 30 months

population:
  n_accounts: 2000
  tenant_id: demo
  initial_fraction: 0.5     # share created during the initial window (established population)
  initial_window_days: 90
  arrivals_end: 2026-01-01  # later arrivals keep >= 6 months of history before calendar end

latents:
  - baseline_engagement
  - scheduling_friction
  - responsiveness
  - service_satisfaction    # initial level; dynamics added in the event-generation step
  - disruption_proneness
  - persistence

archetypes:
  stable_high:
    weight: 0.25
    sd: 0.5
    means:
      baseline_engagement: 1.0
      scheduling_friction: -0.5
      responsiveness: 0.8
      service_satisfaction: 0.8
      disruption_proneness: -0.5
      persistence: 0.8
  sparse_stable:
    weight: 0.15
    sd: 0.5
    means:
      baseline_engagement: -0.8
      scheduling_friction: 0.0
      responsiveness: 0.3
      service_satisfaction: 0.5
      disruption_proneness: -0.5
      persistence: 0.6
  gradual_decline:
    weight: 0.15
    sd: 0.5
    means:
      baseline_engagement: 0.3
      scheduling_friction: 0.3
      responsiveness: 0.0
      service_satisfaction: 0.0
      disruption_proneness: 0.0
      persistence: -0.3
    dynamics:
      satisfaction_drift_per_year: -1.0
  disruption_recovery:
    weight: 0.12
    sd: 0.5
    means:
      baseline_engagement: 0.5
      scheduling_friction: 0.0
      responsiveness: 0.3
      service_satisfaction: 0.3
      disruption_proneness: 1.2
      persistence: 1.0
  disruption_lapse:
    weight: 0.10
    sd: 0.5
    means:
      baseline_engagement: 0.2
      scheduling_friction: 0.3
      responsiveness: -0.2
      service_satisfaction: 0.0
      disruption_proneness: 1.2
      persistence: -1.0
  chronic_low:
    weight: 0.13
    sd: 0.5
    means:
      baseline_engagement: -1.0
      scheduling_friction: 0.8
      responsiveness: -0.8
      service_satisfaction: -0.5
      disruption_proneness: 0.3
      persistence: -0.8
  false_alarm:
    weight: 0.10
    sd: 0.5
    means:
      baseline_engagement: 0.6
      scheduling_friction: 0.4
      responsiveness: 0.2
      service_satisfaction: 0.4
      disruption_proneness: 0.3
      persistence: 0.5
    dynamics:
      dip_rate_per_year: 1.5
      dip_mean_duration_days: 21

# Time-varying dynamics. Probabilities are daily; predictors marked "logit" are on the log-odds scale.
# State variables to pathways: satisfaction, disrupted (0/1), and propensity (disengagement pathways only).
dynamics:
  satisfaction:
    anchor_latent: service_satisfaction
    reversion: 0.02             # daily pull toward the (possibly drifting) anchor
    noise_sd: 0.05              # daily innovation; stationary SD ~= 0.05 / sqrt(2 * 0.02) = 0.25
  disruption:
    onset:                      # logit: a disruption starts today
      intercept: -6.5
      coefficients:
        disruption_proneness: 0.8
    mean_duration_days: 30
  propensity:                   # engagement propensity E(t), identity link
    intercept: 0.0
    coefficients:
      scheduling_friction: -0.2
      satisfaction: 0.5
      disrupted: -1.5
  disengagement:
    hazard:                     # logit: an engaged account disengages today
      intercept: -7.0
      coefficients:
        propensity: -1.2
        persistence: -0.5
    recovery:                   # logit: a disengaged account re-engages today
      intercept: -6.5
      coefficients:
        persistence: 0.6

# Observable event generation. Predictors are logits per opportunity (stated per block). Inputs: declared latents
# plus state varibles satisfaction, disrupted (0/1), dip (0/1), disengaged (0/1). The operator policy uses only
# the account's past events.
events:
  activity_hours:
    start: 8
    end: 20
  sessions:
    booking:                    # logit, per day while no session is booked
      intercept: -3.0
      coefficients:
        baseline_engagement: 0.6
        satisfaction: 0.3
        disrupted: -1.5
        dip: -2.0
        disengaged: -3.5
    operator_booking_share: 0.2
    lead_days_mean: 7
    operator_cancel_prob: 0.03
    cancel_notice_hours_max: 72
    account_cancel:                     # logit, per booked session
      intercept: -3.0
      coefficients:
        scheduling_friction: 0.6
        satisfaction: -0.3
        disrupted: 1.5
        disengaged: 2.0
    no_show:                            # logit, per session not cancelled
      intercept: -3.2
      coefficients:
        scheduling_friction: 0.6
        satisfaction: -0.3
        disrupted: 1.2
        disengaged: 2.5
    completed_shock: 0.05
    operator_cancel_shock: -0.3
  followups:
    required_prob: 0.3
    request_delay_hours_mean: 12
    completion:                         # logit, per follow-up
      intercept: 0.5
      coefficients:
        persistence: 0.8
        satisfaction: 0.3
        disengaged: -3.0
    delay_days_mean: 4
  tasks:
    interval_days: 60
    completion:                         # logit, per task
      intercept: 0.3
      coefficients:
        persistence: 0.8
        responsiveness: 0.4
        disengaged: -3.0
    delay_days_mean: 6
  messages:
    reminder_days_before: 1
    nudge_after_days: 21
    nudge_cooldown_days: 14
    nudge_reset_by:                     # account-initiated event types hat reset the nudge timer
      - session.booked
      - session.completed
      - message.replied
      - followup.completed
      - task.completed
    open:                               # logit, per message
      intercept: 0.0
      coefficients:
        responsiveness: 0.8
        disrupted: -0.5
        disengaged: -1.5
    reply:                              # logit, per opened message
      intercept:  -1.0
      coefficients:
        responsiveness: 0.8
        satisfaction: 0.3
        disengaged: -2.5
    open_delay_hours_mean: 6
    reply_delay_hours_mean: 12      

# Observation noise applied to the clean event stream to produce the observable store.
noise:
  exempt_types: [account.created]   # system-of-record events are never perturbed
  drop_prob: 0.03                   # event never recorded
  delay_prob: 0.10                  # event recorded late
  delay_median_hours: 24            # lognormal recording delay
  delay_sigma: 1.0                  # p95 delay ~ 5 days
  jitter_minutes: 5                 # timestamp imprecision (uniform +/-)
  duplicate_prob: 0.005             # same event ingested twice (identical row)