[project]
name = "engagement-intelligence"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JoseBozelli", email = "jbozellijr@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "numpy>=2.4.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
    "xgboost>=3.2.0",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
